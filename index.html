<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Via ferraty — dobierz sprzęt</title>
<meta name="description" content="Jak dobrać lonżę, kask, uprząż i rękawice na via ferraty. Praktyczny poradnik z konfiguratorem zestawu pod poziom, budżet i priorytet — z konkretnymi modelami i cenami.">
<meta property="og:title" content="Via ferraty — dobierz sprzęt">
<meta property="og:description" content="Jak dobrać lonżę, kask, uprząż i rękawice na via ferraty. Praktyczny poradnik z konfiguratorem zestawu pod poziom, budżet i priorytet — z konkretnymi modelami i cenami.">
<meta property="og:type" content="website">
<meta property="og:locale" content="pl_PL">
<meta property="og:site_name" content="Sprzęt na via ferraty">
<meta name="twitter:card" content="summary">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
:root {
  --ink: #182622;
  --forest: #163b35;
  --forest-deep: #0d2e29;
  --sage: #8fa99c;
  --cream: #f4f0e6;
  --paper: #fbfaf6;
  --rust: #d76c3a;
  --rust-dark: #b84f26;
  --blue: #617f88;
  --sand: #c7a26a;
  --line: rgba(24, 38, 34, .14);
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body { margin: 0; color: var(--ink); background: var(--paper); font-family: "DM Sans", sans-serif; -webkit-font-smoothing: antialiased; }
button, a { -webkit-tap-highlight-color: transparent; }
button { font: inherit; }
a { color: inherit; }
.shell { width: min(1180px, calc(100% - 48px)); margin-inline: auto; }
.eyebrow { margin: 0 0 18px; color: #d9b89e; font: 700 12px/1.2 "Manrope", sans-serif; letter-spacing: .16em; }
.eyebrow.dark { color: var(--rust-dark); }
h1, h2, h3 { font-family: "Manrope", sans-serif; margin-top: 0; }

.hero { min-height: 760px; color: #fff; background: var(--forest-deep); overflow: hidden; position: relative; }
.hero::before { content: ""; position: absolute; inset: 0; background: radial-gradient(circle at 80% 0%, rgba(143,169,156,.22), transparent 38%), linear-gradient(135deg, transparent 55%, rgba(255,255,255,.025)); pointer-events: none; }
.nav { height: 84px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid rgba(255,255,255,.12); position: relative; z-index: 2; }
.brand { display: flex; align-items: center; gap: 12px; color: #fff; text-decoration: none; font: 700 14px/1 "Manrope", sans-serif; }
.brand-mark { width: 38px; height: 38px; display: grid; place-items: center; color: var(--forest-deep); background: #e6ddce; border-radius: 50%; font-size: 12px; }
.nav-cta { color: #fff; text-decoration: none; border-bottom: 1px solid rgba(255,255,255,.5); padding: 10px 0; font-size: 14px; }
.hero-grid { display: grid; grid-template-columns: 1.04fr .96fr; align-items: center; min-height: 675px; position: relative; z-index: 1; }
.hero-copy { padding: 72px 30px 80px 0; }
.hero h1 { max-width: 720px; margin-bottom: 24px; font-size: clamp(46px, 5.1vw, 72px); line-height: 1.04; letter-spacing: -.05em; }
.hero-lead { max-width: 650px; color: rgba(255,255,255,.72); font-size: 18px; line-height: 1.7; }
.hero-actions { display: flex; align-items: center; gap: 28px; margin-top: 34px; }
.primary-btn { min-height: 54px; padding: 0 22px; display: inline-flex; align-items: center; gap: 24px; border-radius: 3px; color: #fff; background: var(--rust); text-decoration: none; font-weight: 700; transition: .2s ease; }
.primary-btn:hover { background: var(--rust-dark); transform: translateY(-2px); }
.text-link { color: #fff; text-underline-offset: 5px; font-size: 14px; }
.hero-proof { display: flex; gap: 24px; margin-top: 68px; color: rgba(255,255,255,.55); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; }
.hero-visual { height: 100%; min-height: 620px; position: relative; }
.sun { position: absolute; width: 270px; height: 270px; top: 70px; right: 30px; border-radius: 50%; background: #de7d4d; opacity: .86; }
.mountains { position: absolute; width: 115%; max-width: 690px; right: -60px; bottom: 54px; overflow: visible; }
.mountain-back { fill: #496a61; opacity: .85; }
.mountain-front { fill: #244c45; }
.ridge { fill: none; stroke: rgba(255,255,255,.4); stroke-width: 2; }
.cable { fill: none; stroke: #e5d5c5; stroke-width: 4; stroke-dasharray: 3 10; stroke-linecap: round; }
.mountains circle { fill: var(--rust); stroke: #fff; stroke-width: 3; }
.gear-orbit { position: absolute; display: grid; place-items: center; border: 1px solid rgba(255,255,255,.22); background: rgba(13,46,41,.85); box-shadow: 0 22px 50px rgba(0,0,0,.18); backdrop-filter: blur(8px); }
.gear-orbit svg { width: 70px; fill: none; stroke: #fff; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.orbit-one { width: 128px; height: 128px; border-radius: 50%; top: 115px; left: 8%; }
.orbit-two { width: 150px; height: 150px; border-radius: 28px; right: 3%; bottom: 110px; transform: rotate(5deg); }
.orbit-two svg { transform: rotate(-5deg); }
.hero-note { position: absolute; left: 15%; bottom: 90px; display: flex; flex-direction: column; padding-left: 16px; border-left: 2px solid var(--rust); }
.hero-note b { font: 700 18px/1.3 "Manrope", sans-serif; }
.hero-note span { color: rgba(255,255,255,.64); font-size: 12px; }

.guide { padding: 104px 0 118px; background: var(--cream); }
.section-heading, .ranking-head { display: grid; grid-template-columns: 1fr .72fr; gap: 80px; align-items: end; margin-bottom: 42px; }
.section-heading h2, .ranking-head h2, .config-intro h2 { margin-bottom: 0; font-size: clamp(36px, 4vw, 54px); line-height: 1.1; letter-spacing: -.045em; }
.section-heading > p, .ranking-head > p { margin: 0 0 5px; color: #56635f; line-height: 1.7; }
.equipment-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
.equipment-card { min-height: 390px; padding: 24px; border: 1px solid var(--line); background: rgba(255,255,255,.45); position: relative; transition: .22s ease; }
.equipment-card:hover { transform: translateY(-5px); background: rgba(255,255,255,.75); box-shadow: 0 18px 40px rgba(24,38,34,.08); }
.equipment-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 36px; }
.equipment-icon { width: 84px; height: 84px; display: grid; place-items: center; border-radius: 50%; background: #e6ddce; }
.equipment-icon svg { width: 54px; fill: none; stroke: var(--forest); stroke-width: 2.1; stroke-linecap: round; stroke-linejoin: round; }
.equipment-card.orange .equipment-icon { background: #efd4c1; }
.equipment-card.blue .equipment-icon { background: #d6e0df; }
.equipment-card.green .equipment-icon { background: #d5ded5; }
.equipment-card.sand .equipment-icon { background: #e9dcc6; }
.norm { padding: 6px 9px; border: 1px solid var(--line); border-radius: 99px; font-size: 10px; font-weight: 700; text-transform: uppercase; }
.card-kicker { margin: 0 0 7px !important; color: var(--rust-dark) !important; font-size: 11px !important; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
.equipment-card h3 { margin-bottom: 12px; font-size: 26px; letter-spacing: -.03em; }
.equipment-card > p { color: #56635f; font-size: 14px; line-height: 1.65; }
details { margin-top: 22px; border-top: 1px solid var(--line); }
summary { padding: 16px 0 0; cursor: pointer; list-style: none; font-size: 13px; font-weight: 700; }
summary::-webkit-details-marker { display: none; }
summary::after { content: "+"; float: right; color: var(--rust-dark); font-size: 18px; }
details[open] summary::after { content: "−"; }
details ul { margin: 12px 0 0; padding: 0; list-style: none; color: #56635f; font-size: 13px; }
details li { padding: 5px 0 5px 16px; position: relative; }
details li::before { content: "✓"; position: absolute; left: 0; color: var(--rust-dark); font-weight: 700; }
.ranking-wrap { margin-top: 108px; }
.ranking-list { border-top: 1px solid var(--line); }
.rank-row { display: grid; grid-template-columns: 70px 1.35fr 1fr 96px; gap: 28px; align-items: center; min-height: 175px; padding: 25px 0; border-bottom: 1px solid var(--line); }
.rank-number { color: var(--rust-dark); font: 700 15px/1 "Manrope", sans-serif; }
.rank-label { color: var(--rust-dark); font-size: 10px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; }
.rank-main h3 { margin: 7px 0 7px; font-size: 21px; }
.rank-main p { margin: 0; color: #64716d; font-size: 13px; line-height: 1.55; }
.rank-facts { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
.rank-facts div { display: flex; flex-direction: column; gap: 5px; }
.rank-facts span { color: #7b8582; font-size: 10px; text-transform: uppercase; }
.rank-facts b { font-size: 12px; line-height: 1.35; }
.rank-score { text-align: right; }
.rank-score b { display: block; font: 700 24px/1 "Manrope", sans-serif; white-space: nowrap; }
.rank-score span { display: block; margin-top: 6px; color: #7b8582; font-size: 11px; }
.secondary-btn { display: block; margin: 28px auto 0; padding: 13px 18px; border: 1px solid var(--line); color: var(--forest); background: transparent; cursor: pointer; font-weight: 700; }
.secondary-btn:hover { border-color: var(--forest); }

.config-section { padding: 110px 0 35px; color: #fff; background: var(--forest-deep); }
.config-intro { max-width: 820px; margin-bottom: 50px; }
.config-intro > p:last-child { max-width: 680px; color: rgba(255,255,255,.65); line-height: 1.7; }
.config-grid { display: grid; grid-template-columns: 1fr .9fr; gap: 24px; align-items: start; }
.config-form, .recommendation { border: 1px solid rgba(255,255,255,.13); background: rgba(255,255,255,.04); }
.config-form { padding: 34px; }
fieldset { margin: 0 0 34px; padding: 0 0 30px; border: 0; border-bottom: 1px solid rgba(255,255,255,.12); }
fieldset:last-child { margin-bottom: 0; padding-bottom: 0; border-bottom: 0; }
legend { width: 100%; margin-bottom: 16px; font: 700 15px/1.3 "Manrope", sans-serif; }
legend span { display: inline-grid; place-items: center; width: 26px; height: 26px; margin-right: 10px; border-radius: 50%; color: var(--forest-deep); background: #e6ddce; font-size: 11px; }
.option-grid { display: grid; gap: 10px; }
.option-grid.two { grid-template-columns: repeat(2, 1fr); }
.option-grid.three { grid-template-columns: repeat(3, 1fr); }
.option { min-height: 84px; padding: 14px; text-align: left; color: #fff; border: 1px solid rgba(255,255,255,.13); background: transparent; cursor: pointer; transition: .18s ease; }
.option:hover { border-color: rgba(255,255,255,.45); }
.option.active { border-color: #dc8a60; background: rgba(215,108,58,.16); box-shadow: inset 0 0 0 1px #dc8a60; }
.option b, .option small { display: block; }
.option b { margin-bottom: 7px; font-size: 13px; }
.option small { color: rgba(255,255,255,.55); font-size: 10px; line-height: 1.35; }
.option.active small { color: rgba(255,255,255,.76); }
.form-hint { margin: 10px 0 0; color: rgba(255,255,255,.45); font-size: 10px; }
.recommendation { padding: 34px; position: sticky; top: 18px; background: #f3efe5; color: var(--ink); box-shadow: 0 30px 70px rgba(0,0,0,.18); }
.recommendation-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 24px; }
.result-pill { padding: 7px 9px; color: #fff; background: var(--rust); font-size: 9px; font-weight: 800; letter-spacing: .11em; }
.match { color: #5f716b; font-size: 11px; }
.recommendation h3 { margin-bottom: 9px; font-size: 30px; line-height: 1.15; letter-spacing: -.04em; }
.route { margin: 0 0 25px; color: #61706b; font-size: 13px; }
.result-items { border-top: 1px solid var(--line); }
.result-item { display: grid; grid-template-columns: 25px 1fr auto; gap: 10px; align-items: start; padding: 18px 0; border-bottom: 1px solid var(--line); }
.check { display: grid; place-items: center; width: 20px; height: 20px; border-radius: 50%; color: #fff; background: var(--forest); font-size: 11px; }
.product-copy > b { display: block; margin-bottom: 3px; color: #71807b; font: 700 9px/1.3 "Manrope", sans-serif; letter-spacing: .1em; text-transform: uppercase; }
.product-name { display: inline-block; color: var(--forest); font: 800 14px/1.35 "Manrope", sans-serif; text-decoration-thickness: 1px; text-underline-offset: 3px; }
.product-name span { color: var(--rust-dark); font-size: 11px; }
.result-item p { margin: 4px 0 0; color: #62716c; font-size: 12px; line-height: 1.45; }
.product-meta { display: flex; align-items: flex-end; flex-direction: column; gap: 8px; }
.product-meta em { padding: 5px 7px; border-radius: 99px; color: var(--forest); background: #dfe5df; font-size: 9px; font-style: normal; font-weight: 700; white-space: nowrap; }
.product-meta strong { color: var(--rust-dark); font: 800 11px/1.2 "Manrope", sans-serif; white-space: nowrap; }
.result-summary { display: grid; grid-template-columns: 105px 1fr; gap: 18px; margin: 22px 0; padding: 16px; background: #e7e0d2; }
.result-summary div { display: flex; flex-direction: column; gap: 5px; }
.result-summary span { color: #6b7773; font-size: 10px; text-transform: uppercase; }
.result-summary b { font-size: 12px; }
.result-summary small { color: #78847f; font-size: 9px; line-height: 1.35; }
.result-summary p { margin: 0; color: #4f5d59; font-size: 11px; line-height: 1.5; }
.budget-note { margin: -8px 0 22px; padding: 12px 14px; border-left: 3px solid var(--rust); color: #4f5d59; background: #fbf4ec; font-size: 11px; line-height: 1.5; }
.checklist-btn { display: flex; justify-content: center; align-items: center; min-height: 48px; color: #fff; background: var(--forest); text-decoration: none; font-size: 12px; font-weight: 700; }
.safety-panel { margin-top: 80px; padding: 44px; border: 1px solid rgba(255,255,255,.15); background: rgba(255,255,255,.045); }
.safety-title { display: grid; grid-template-columns: 64px 1fr; gap: 24px; align-items: start; }
.safety-title > span { display: grid; place-items: center; width: 54px; height: 54px; border: 1px solid #dc8a60; border-radius: 50%; color: #dc8a60; font: 800 24px/1 "Manrope", sans-serif; }
.safety-title h2 { max-width: 830px; margin-bottom: 0; font-size: clamp(27px, 3.3vw, 42px); line-height: 1.16; letter-spacing: -.04em; }
.safety-columns { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px 38px; margin: 42px 0 0 88px; }
.safety-columns b { font: 700 13px/1.3 "Manrope", sans-serif; }
.safety-columns p { color: rgba(255,255,255,.6); font-size: 12px; line-height: 1.65; }
footer { display: flex; align-items: center; justify-content: space-between; gap: 30px; margin-top: 70px; padding: 30px 0 0; border-top: 1px solid rgba(255,255,255,.12); color: rgba(255,255,255,.47); font-size: 11px; }
.footer-links { display: flex; gap: 20px; }
.footer-links a { color: rgba(255,255,255,.7); text-underline-offset: 4px; }

@media (max-width: 980px) {
  .hero-grid { grid-template-columns: 1fr; }
  .hero-copy { padding-right: 0; padding-bottom: 20px; }
  .hero-visual { min-height: 470px; }
  .sun { top: 25px; }
  .equipment-grid { grid-template-columns: repeat(2, 1fr); }
  .rank-row { grid-template-columns: 48px 1.3fr .9fr 88px; gap: 18px; }
  .safety-columns { grid-template-columns: repeat(2, 1fr); margin-left: 0; }
  .config-grid { grid-template-columns: 1fr; }
  .recommendation { position: static; }
}

@media (max-width: 680px) {
  .shell { width: min(100% - 28px, 560px); }
  .nav { height: 68px; }
  .brand span:last-child { display: none; }
  .nav-cta { font-size: 12px; }
  .hero { min-height: auto; }
  .hero-copy { padding-top: 56px; }
  .hero h1 { font-size: 42px; line-height: 1.06; }
  .hero-lead { font-size: 16px; line-height: 1.62; }
  .hero-actions { align-items: stretch; flex-direction: column; gap: 17px; }
  .primary-btn { justify-content: space-between; width: 100%; }
  .text-link { align-self: flex-start; }
  .hero-proof { flex-wrap: wrap; gap: 10px 16px; margin-top: 42px; }
  .hero-visual { min-height: 365px; }
  .sun { width: 200px; height: 200px; right: 0; }
  .mountains { width: 125%; right: -68px; bottom: 24px; }
  .orbit-one { width: 96px; height: 96px; top: 72px; left: 3%; }
  .orbit-two { width: 106px; height: 106px; right: 0; bottom: 70px; }
  .gear-orbit svg { width: 48px; }
  .hero-note { left: 7%; bottom: 38px; }
  .guide, .config-section { padding-top: 76px; }
  .section-heading, .ranking-head { grid-template-columns: 1fr; gap: 18px; }
  .section-heading h2, .ranking-head h2, .config-intro h2 { font-size: 36px; }
  .equipment-grid { grid-template-columns: 1fr; }
  .equipment-card { min-height: auto; padding: 22px; }
  .equipment-top { margin-bottom: 22px; }
  .equipment-icon { width: 72px; height: 72px; }
  .ranking-wrap { margin-top: 76px; }
  .rank-row { grid-template-columns: 42px 1fr 78px; gap: 10px; min-height: 0; padding: 24px 0; }
  .rank-facts { grid-column: 2 / 4; }
  .rank-score { grid-column: 3; grid-row: 1; }
  .rank-main { grid-column: 2; }
  .config-form, .recommendation { padding: 22px; }
  .option-grid.two, .option-grid.three { grid-template-columns: 1fr; }
  .option { min-height: 68px; }
  .recommendation h3 { font-size: 27px; }
  .result-item { grid-template-columns: 24px 1fr; }
  .product-meta { grid-column: 2; align-items: flex-start; flex-direction: row; flex-wrap: wrap; }
  .result-summary { grid-template-columns: 1fr; }
  .safety-panel { margin-top: 58px; padding: 28px 22px; }
  .safety-title { grid-template-columns: 1fr; }
  .safety-title > span { width: 46px; height: 46px; }
  .safety-columns { grid-template-columns: 1fr; gap: 13px; margin: 32px 0 0; }
  footer { align-items: flex-start; flex-direction: column; margin-top: 52px; }
  .footer-links { flex-direction: column; gap: 10px; }
}

@media (prefers-reduced-motion: reduce) {
  * { scroll-behavior: auto !important; transition: none !important; }
}
</style>
